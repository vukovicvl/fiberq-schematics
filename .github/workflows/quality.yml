name: Plugin release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Pure model and language checks
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v
          test_domain test_housing_layout test_housing_multi
          test_closure_layout test_cable_catalog test_fiber_model
          test_outlet_layout test_reports test_i18n test_plugin_packaging
      - run: python tools/build_plugin.py
      - run: python tools/check_release.py release/fiberq_schematics-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fiberq-schematics-1.0.0
          path: |
            release/fiberq_schematics-1.0.0.zip
            release/fiberq_schematics-1.0.0.zip.sha256
            release/reports/
